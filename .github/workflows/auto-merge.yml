name: Request Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  request-auto-merge:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - name: Create delivery token
        id: delivery-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CHIO_DELIVERY_APP_ID }}
          private-key: ${{ secrets.CHIO_DELIVERY_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Request squash auto-merge
        env:
          GH_TOKEN: ${{ steps.delivery-token.outputs.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          gh pr merge "$PR_URL"
          --repo "$GITHUB_REPOSITORY"
          --auto
          --squash
          --delete-branch
          --match-head-commit "$PR_HEAD_SHA"
